# Netlify builds the site from this repository: Vite writes the pages to dist/, and the API (/api/…) is the
# functions in netlify/functions/. The Facebook settings are environment variables in Netlify (see README.md).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"

# Vite names every file in /assets/ after its content (index-BNqPO66q.js), so a changed file gets a new name and the
# old one never changes. Browsers may keep them for a year instead of asking again on every visit (Netlify's default
# is to ask again), which saves requests and bandwidth for people who come back. index.html keeps the default, so a
# new version is seen at once.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The site that was on kupeen9520.dk before had one page per subject. Its addresses live on in search results and old
# posts, so each leads to the matching section of this page (301: moved for good). The page itself scrolls to the
# section named after the #, see useJumpToSection in src/App.tsx.
[[redirects]]
  from = "/aktiviteter"
  to = "/#aktiviteter"
  status = 301

# A single event on the old site (/aktiviteter/<id>): its ids are not Facebook's, so it leads to the whole programme.
[[redirects]]
  from = "/aktiviteter/*"
  to = "/#aktiviteter"
  status = 301

[[redirects]]
  from = "/bliv-medlem"
  to = "/#bliv-medlem"
  status = 301

[[redirects]]
  from = "/om-os"
  to = "/#om-os"
  status = 301

[[redirects]]
  from = "/gode-ideer"
  to = "/#gode-ideer"
  status = 301
